<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo AVA Grow - EdTech</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <section class="phone">
      <header class="status-bar">
        <span>9:41</span>
        <span>▮▮ Wi-Fi ▰</span>
      </header>

      <section id="screen" class="screen"></section>
    </section>

    <aside class="prototype-map">
      <h1>AVA Grow</h1>
      <p>Protótipo clicável inspirado nas telas enviadas.</p>

      <div class="map-buttons">
        <button data-go="role">Entrada</button>
        <button data-go="login">Login</button>
        <button data-go="studentDashboard">Aluno</button>
        <button data-go="teacherDashboard">Professor</button>
        <button data-go="volDashboard">Voluntário</button>
      </div>

      <p class="hint">Use os botões dentro do celular para navegar.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
